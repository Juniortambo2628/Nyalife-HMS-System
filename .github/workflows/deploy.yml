name: 🚀 Deploy Nyalife HMS to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 📦 Build Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build/
          retention-days: 1

  deploy:
    name: 🚀 Deploy to cPanel
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: public/build/

      - name: 📂 Deploy backend to nyalife_core
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: /nyalife_core/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/sessions/**
            **/storage/framework/cache/**
            **/vendor/**
            **/*.sql
            **/docs/production/**

      - name: 🌐 Deploy public assets to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./public/
          server-dir: /public_html/
          exclude: |
            **/index.php
            **/.htaccess
            **/storage/**

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🔧 Run post-deploy commands via SSH
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'DEPLOY'
            set -e
            cd /home1/nyalifew/nyalife_core

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "📦 Installing composer dependencies..."
            if command -v composer &> /dev/null; then
              composer install --no-dev --optimize-autoloader --no-interaction
            elif [ -f "composer.phar" ]; then
              php composer.phar install --no-dev --optimize-autoloader --no-interaction
            else
              curl -sS https://getcomposer.org/installer | php
              php composer.phar install --no-dev --optimize-autoloader --no-interaction
            fi

            echo "🗄️ Running migrations..."
            php artisan migrate --force

            echo "🗄️ Migrating production data..."
            php artisan production:migrate-data 2>&1 || echo "⚠️ Data migration skipped"

            echo "🔧 Clearing and rebuilding caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🔒 Fixing permissions..."
            chmod -R 775 storage
            chmod -R 775 bootstrap/cache

            echo "✅ Deployment complete!"
          DEPLOY
