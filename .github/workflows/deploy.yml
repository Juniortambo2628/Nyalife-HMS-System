name: 🚀 Deploy Nyalife HMS to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger from GitHub Actions tab

jobs:
  build:
    name: 📦 Build Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build/
          retention-days: 1

  deploy:
    name: 🚀 Deploy to cPanel
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Verify runner environment
        shell: cmd
        run: |
          echo Git version:
          git --version
          echo SSH available:
          where ssh
          echo PHP version:
          php --version
          echo Composer version:
          composer --version


      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: public/build/

      - name: 📂 Deploy backend to nyalife_core
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: /nyalife_core/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/sessions/**
            **/storage/framework/cache/**
            **/vendor/**
            **/*.sql
            **/docs/production/**

      - name: 🌐 Deploy public assets to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./public/
          server-dir: /public_html/
          exclude: |
            **/index.php
            **/.htaccess
            **/storage/**

      - name: 🔧 Run post-deploy commands via SSH
        shell: cmd
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "bash -l -c \"cd /home1/nyalifew/nyalife_core && composer install --no-dev --optimize-autoloader --no-interaction && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan event:cache && chmod -R 775 storage && chmod -R 775 bootstrap/cache\""



