name: 🚀 Deploy Nyalife HMS to Production

on:
  # Deployment is gated by the successful completion of the CI workflow.
  # This keeps CI concerns separate from deployment and avoids duplicating
  # test jobs inside the deploy workflow.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    name: 📦 Build Assets
    runs-on: ubuntu-latest
    # Only proceed when the CI workflow succeeded, or when this is a manual run.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, mysql, curl, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build/
          retention-days: 1

  deploy:
    name: 🚀 Deploy to cPanel
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: public/build/

      - name: 📂 Deploy backend to nyalife_core
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: /nyalife_core/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/sessions/**
            **/storage/framework/cache/**
            **/*.sql
            **/docs/production/**

      # NOTE: Production deploys via FTP only — there is no `php artisan migrate`
      # step in this workflow. cPanel shared hosting typically exposes the
      # deployed files but not a CI-runnable PHP CLI. After each deploy an
      # operator must run `php artisan migrate --force` manually via cPanel
      # Terminal (or `php-cli` over SSH if available) from
      # /home1/nyalifew/nyalife_core. Schema changes shipped in this deploy
      # are not active until that command is run.
      #
      # The defensive controller guard in `ConsultationController::store`
      # (mb_substr($parity, 0, 50)) prevents silent data loss even before
      # migrations are run, but the underlying schema still needs the ALTER
      # to commit. See docs/MIGRATIONS.md for the full runbook.

      - name: 🌐 Deploy public assets to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./public/
          server-dir: /public_html/
          exclude: |
            **/index.php
            **/.htaccess
            **/storage/**
